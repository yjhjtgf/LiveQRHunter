name: Build

on:
  push:
    branches: [ "main" ]
    tags: ["v*"]
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release
  PROJECT_NAME: LiveQRHunter
  PROJECT_VERSION: 1.0.1
  VCPKG_TARGET_TRIPLET: x64-windows-static-md

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure CMake
        run: |
          cmake -B build `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIGURATION }} `
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TARGET_TRIPLET }} `
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}\install

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_CONFIGURATION }} --parallel

      - name: Install
        run: cmake --install build --config ${{ env.BUILD_CONFIGURATION }}

      - name: Copy ScanModel
        run: Copy-Item -Recurse -Force ScanModel install\${{ env.PROJECT_NAME }}_${{ env.PROJECT_VERSION }}\ScanModel

      - name: Verify Qt runtime deployed
        run: |
          $dir = "install\${{ env.PROJECT_NAME }}_${{ env.PROJECT_VERSION }}"
          $required = @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "Qt6Network.dll", "platforms\qwindows.dll")
          foreach ($f in $required) {
            if (-not (Test-Path "$dir\$f")) { Write-Error "缺少 Qt 运行库: $f (windeployqt 未生效?)"; exit 1 }
          }
          Write-Output "Qt runtime verified OK"

      - name: Create ZIP
        run: |
          Compress-Archive -Path "install\${{ env.PROJECT_NAME }}_${{ env.PROJECT_VERSION }}\*" -DestinationPath "${{ env.PROJECT_NAME }}_${{ github.ref_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}_${{ github.ref_name }}
          path: ${{ env.PROJECT_NAME }}_${{ github.ref_name }}.zip
          retention-days: 5

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: ${{ env.PROJECT_NAME }}_${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
